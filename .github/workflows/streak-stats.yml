name: Diagnose stats token
on:
  workflow_dispatch:
    inputs:
      private_repository:
        description: Private repository used only for access probes
        required: true
        type: string
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe the configured PAT directly
        env:
          GH_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
        run: |
          python3 - <<'PY'
          import collections, json, os, urllib.request, urllib.error
          from pathlib import Path
          token = os.environ.get('GH_TOKEN', '')
          if not token:
              raise SystemExit('STREAK_STATS_TOKEN is not configured')
          def api(path, body=None):
              request = urllib.request.Request('https://api.github.com' + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json', 'User-Agent': 'Maiturin-stats-diagnostic'})
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return response.status, json.load(response), response.headers
              except urllib.error.HTTPError as error:
                  return error.code, None, error.headers
          status, user, headers = api('/user')
          print('Authenticated user request status:', status)
          if status != 200:
              raise SystemExit('The configured PAT cannot authenticate')
          print('Identity matches owner:', user['login'].lower() == os.environ['GITHUB_REPOSITORY_OWNER'].lower())
          print('Token kind:', 'fine-grained' if token.startswith('github_pat_') else 'classic or OAuth')
          print('Classic repo scope present:', 'repo' in {s.strip() for s in headers.get('X-OAuth-Scopes','').split(',')})
          print('Granted OAuth scopes:', headers.get('X-OAuth-Scopes', '(not provided)'))
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          target = event['inputs']['private_repository']
          if target.count('/') != 1 or not all(part and all(c.isalnum() or c in '-_.' for c in part) for part in target.split('/')):
              raise SystemExit('Invalid probe repository identifier')
          for endpoint in ('', '/languages', '/contents'):
              status, _, _ = api('/repos/' + target + endpoint)
              print('Known private repository probe', endpoint or '/metadata', 'status:', status)
          query = '''query($login:String!) { user(login:$login) {
            repositories(first:100,ownerAffiliations:[OWNER],isFork:false) {
              totalCount pageInfo { hasNextPage } nodes { nameWithOwner isPrivate
                languages(first:10,orderBy:{field:SIZE,direction:DESC}) { edges { size node { name } } }
              }
            }
          } }'''
          status, result, _ = api('/graphql', {'query':query,'variables':{'login':os.environ['GITHUB_REPOSITORY_OWNER']}})
          print('Repository/language GraphQL status:', status)
          if status != 200 or result.get('errors'):
              raise SystemExit('Repository/language query failed')
          repositories = result['data']['user']['repositories']
          nodes = repositories['nodes']
          private = [r for r in nodes if r['isPrivate']]
          print('Owned non-fork repositories visible:', len(nodes))
          print('Private repositories visible:', len(private))
          print('More than 100 repositories:', repositories['pageInfo']['hasNextPage'])
          totals = collections.Counter()
          for r in nodes:
              totals.update({e['node']['name']:e['size'] for e in r['languages']['edges']})
          top = totals.most_common(6)
          denominator = sum(size for _, size in top)
          percentages = {name:round(100*size/denominator,2) for name,size in top}
          print('Direct API language percentages:', json.dumps(percentages))
          (Path(os.environ['RUNNER_TEMP'])/'language-probe.json').write_text(json.dumps({'private_count':len(private),'percentages':percentages}))
          PY
      - name: Generate card through the current pinned Action
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&locale=en&theme=default&hide_border=true&disable_animations=true&show_icons=true&layout=compact"
          path: ${{ runner.temp }}/diagnostic-top-langs.svg
          token: ${{ secrets.STREAK_STATS_TOKEN }}
          core_version: "2.2.1"
          fail_on_error: "true"
      - name: Compare direct API data with the rendered card
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          temp = Path(os.environ['RUNNER_TEMP'])
          expected = json.loads((temp/'language-probe.json').read_text())
          root = ET.parse(temp/'diagnostic-top-langs.svg').getroot()
          actual = {}
          for node in root.iter():
              if node.get('data-testid') == 'lang-name':
                  name, percent = ' '.join(node.itertext()).strip().rsplit(' ',1)
                  actual[name] = float(percent.rstrip('%'))
          print('Rendered Action language percentages:', json.dumps(actual))
          print('Matches direct API results:', actual == expected['percentages'])
          print('Configured PAT can enumerate private repositories:', expected['private_count'] > 0)
          PY
